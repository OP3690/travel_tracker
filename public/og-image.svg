<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Floating pin markers to signal "pin places on a map" without a full world map -->
  <g opacity="0.92">
    <g transform="translate(170,440)">
      <circle r="22" fill="#f59e0b"/>
      <circle r="7" fill="#ffffff"/>
    </g>
    <g transform="translate(1020,180)">
      <circle r="18" fill="#10b981"/>
      <circle r="6" fill="#ffffff"/>
    </g>
    <g transform="translate(1070,480)">
      <circle r="14" fill="#f43f5e"/>
      <circle r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Brand mark -->
  <g transform="translate(72,76)">
    <!-- Triangle mountain -->
    <path d="M0 42 L22 0 L44 42 Z" fill="#ffffff"/>
    <text x="60" y="34" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
          font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">StampYourMap</text>
  </g>

  <!-- Hero text -->
  <g transform="translate(72,220)" filter="url(#softShadow)">
    <text font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
          font-size="78" font-weight="800" fill="#ffffff" letter-spacing="-2">
      <tspan x="0" y="0">Stamp every country</tspan>
      <tspan x="0" y="92">you've ever visited.</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="72" y="440" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="500" fill="#ffffff" fill-opacity="0.92" letter-spacing="-0.2">
    Free interactive travel map for 195 countries
  </text>
  <text x="72" y="478" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="500" fill="#ffffff" fill-opacity="0.92" letter-spacing="-0.2">
    + 5,000 regions. Memory wall. Trip planner.
  </text>

  <!-- CTA pill -->
  <g transform="translate(72,538)">
    <rect width="300" height="56" rx="28" fill="#ffffff"/>
    <text x="150" y="37" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
          font-size="22" font-weight="800" fill="#4c1d95" text-anchor="middle" letter-spacing="-0.3">
      stampyourmap.com →
    </text>
  </g>

  <!-- Free forever badge -->
  <g transform="translate(400,552)">
    <rect width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="75" y="24" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
          font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">
      FREE FOREVER
    </text>
  </g>
</svg>
